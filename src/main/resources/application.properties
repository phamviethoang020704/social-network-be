spring.application.name=MangXaHoi
server.port=8080

# =========================
# PRIMARY DB (MySQL) - h? th?ng chính
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/mangxahoi?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA cho MySQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# =========================
# SEARCH DB (PostgreSQL) - ch? dùng cho search
# =========================
search.datasource.url=jdbc:postgresql://localhost:5432/search_db
search.datasource.username=postgres
search.datasource.password=123456
search.datasource.driver-class-name=org.postgresql.Driver

# Thymeleaf
spring.thymeleaf.cache=false

#config upload img avt
app.upload.dir=F:/webgoat/images-mangxahoi/
app.default.avatar.male=avt-user-default/avt-male-default.png
app.default.avatar.female=avt-user-default/avt-female-default.png

#upload cover-photo
app.default.cover-photo=cover-photo-default/u-bg.jpg

#c?u hình db
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true

#tach fe,be
jwt.secret=12345678901234567890123456789012
jwt.expiration=86400000

# =========================
# REDIS CACHE
# =========================
spring.cache.type=redis

spring.data.redis.host=localhost
spring.data.redis.port=6379

# TTL cache
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

spring.cache.redis.key-prefix=MangXaHoi:
spring.cache.redis.use-key-prefix=true